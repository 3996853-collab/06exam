<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配送运营看板</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    /* ──── Reset & Variables ──── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #3b83f6;
      --primary-light: #eff6ff;
      --primary-50: #dbeafe;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text-1: #1e293b;
      --text-2: #475569;
      --text-3: #94a3b8;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --radius: 12px;
    }

    body {
      font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-1);
      line-height: 1.5;
    }

    /* ──── Animations ──── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes barGrow {
      from { width: 0; }
    }

    /* ──── Root Container ──── */
    .delivery-dashboard {
      padding: 16px 20px 24px;
      min-height: 100vh;
    }

    /* ──── Filter Bar ──── */
    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
      border: 1px solid var(--border);
    }
    .filter-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .filter-left input[type="date"] {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text-1);
      outline: none;
      cursor: pointer;
      background: #fff;
    }
    .filter-left input[type="date"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 131, 246, 0.15);
    }
    .filter-left select {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text-1);
      outline: none;
      cursor: pointer;
      background: #fff;
      min-width: 140px;
    }
    .filter-left select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 131, 246, 0.15);
    }
    .update-time {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-3);
    }
    .update-time svg {
      color: var(--primary);
      width: 16px;
      height: 16px;
    }

    /* ──── KPI Grid ──── */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .kpi-card {
      background: var(--card);
      border-radius: 8px;
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: default;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fadeInUp 0.5s ease both;
    }
    .kpi-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-3px);
      border-color: rgba(59, 131, 246, 0.25);
    }
    .kpi-icon-wrap {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .kpi-icon-wrap svg {
      width: 22px;
      height: 22px;
    }
    .kpi-body {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }
    .kpi-label {
      font-size: 13px;
      color: var(--text-3);
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .kpi-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-1);
      line-height: 1.1;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }
    .kpi-trend {
      display: flex;
      align-items: center;
      gap: 2px;
      font-size: 12px;
      font-weight: 500;
    }
    .kpi-trend svg {
      width: 12px;
      height: 12px;
    }
    .trend-good { color: var(--success); }
    .trend-bad { color: var(--danger); }
    .trend-neutral { color: var(--text-3); }

    /* ──── Charts Row ──── */
    .charts-row {
      display: grid;
      grid-template-columns: 2fr 3fr;
      gap: 16px;
      margin-bottom: 16px;
      align-items: start;
    }
    .chart-card {
      background: var(--card);
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 20px;
      animation: fadeInUp 0.5s ease 0.55s both;
    }
    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 16px;
    }
    .title-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-bar {
      width: 4px;
      height: 18px;
      background: var(--primary);
      border-radius: 2px;
    }
    .card-title h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-1);
    }
    .title-right select {
      padding: 5px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-1);
      outline: none;
      cursor: pointer;
      background: #fff;
      min-width: 140px;
    }

    /* ──── Tab Switcher ──── */
    .ops-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 20px;
      border-bottom: 2px solid #f1f5f9;
    }
    .ops-tab {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.25s ease;
      user-select: none;
    }
    .ops-tab-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-3);
      transition: color 0.25s ease;
    }
    .ops-tab-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 20px;
      padding: 0 7px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      background: #f1f5f9;
      color: var(--text-3);
      transition: all 0.25s ease;
    }
    .ops-tab.active {
      border-bottom-color: var(--primary);
    }
    .ops-tab.active .ops-tab-label {
      color: var(--text-1);
      font-weight: 600;
    }
    .ops-tab.active .ops-tab-badge.badge-blue {
      background: var(--primary);
      color: #fff;
    }
    .ops-tab.active .ops-tab-badge.badge-purple {
      background: #8b5cf6;
      color: #fff;
    }
    .ops-tab.active .ops-tab-badge.badge-orange {
      background: var(--warning);
      color: #fff;
    }
    .ops-tab:hover:not(.active) .ops-tab-label {
      color: var(--text-2);
    }
    .ops-tab-content {
      min-height: 160px;
    }

    /* ──── Operations Section ──── */
    .ops-section {
      padding: 14px 16px;
      background: #f8fafc;
      border-radius: 8px;
      border: 1px solid #f1f5f9;
      transition: opacity 0.2s ease;
    }
    .ops-metrics-row {
      display: flex;
      gap: 20px;
    }
    .ops-metric {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .ops-metric-label {
      font-size: 12px;
      color: var(--text-3);
    }
    .ops-metric-value {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.2;
    }
    .ops-metric-value.blue { color: var(--primary); }
    .ops-metric-value.green { color: var(--success); }
    .ops-metric-value.orange { color: var(--warning); }
    .ops-metric-unit {
      font-size: 11px;
      color: var(--text-3);
    }

    /* ──── Progress Bar ──── */
    .progress-bar-wrap {
      margin-top: 12px;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ──── Funnel ──── */
    .funnel-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .funnel-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeInUp 0.4s ease both;
    }
    .funnel-bar-fill {
      height: 22px;
      border-radius: 4px;
      min-width: 18%;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 0.85;
    }
    .funnel-bar-info {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .funnel-label {
      font-size: 12px;
      color: var(--text-2);
      min-width: 48px;
    }
    .funnel-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-1);
      font-variant-numeric: tabular-nums;
    }

    /* ──── Inventory Cards ──── */
    .inventory-row {
      gap: 12px;
    }
    .inventory-card {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      transition: transform 0.2s ease;
    }
    .inventory-card:hover {
      transform: translateY(-2px);
    }
    .inventory-card.warn {
      background: #fffbeb;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    .inventory-card.warn .inventory-icon-wrap { color: var(--warning); }
    .inventory-card.warn .inventory-value { color: var(--warning); }
    .inventory-card.danger {
      background: #fef2f2;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }
    .inventory-card.danger .inventory-icon-wrap { color: var(--danger); }
    .inventory-card.danger .inventory-value { color: var(--danger); }
    .inventory-icon-wrap {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background: rgba(255,255,255,0.7);
      flex-shrink: 0;
    }
    .inventory-icon-wrap svg {
      width: 20px;
      height: 20px;
    }
    .inventory-info {
      display: flex;
      flex-direction: column;
    }
    .inventory-label {
      font-size: 12px;
      color: var(--text-3);
    }
    .inventory-value {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.2;
    }
    .inventory-unit {
      font-size: 11px;
      color: var(--text-3);
    }

    /* ──── Table Section ──── */
    .table-section {
      background: var(--card);
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 20px;
      animation: fadeInUp 0.5s ease 0.6s both;
      overflow-x: auto;
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .data-table thead th {
      background: #f8fafc;
      color: var(--text-2);
      font-weight: 600;
      font-size: 13px;
      padding: 12px 16px;
      text-align: left;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }
    .data-table thead th.text-right {
      text-align: right;
    }
    .data-table thead th.text-center {
      text-align: center;
    }
    .data-table tbody tr {
      transition: background-color 0.15s ease;
    }
    .data-table tbody tr:hover {
      background-color: var(--primary-light);
    }
    .data-table tbody tr:nth-child(even) {
      background-color: #fafbfc;
    }
    .data-table tbody tr:nth-child(even):hover {
      background-color: var(--primary-light);
    }
    .data-table tbody tr.row-danger {
      background-color: #fef2f2 !important;
    }
    .data-table tbody td {
      padding: 12px 16px;
      color: var(--text-2);
      border-bottom: 1px solid var(--border);
    }
    .data-table tbody td.text-right {
      text-align: right;
    }
    .data-table tbody td.text-center {
      text-align: center;
    }
    .warehouse-name {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      color: var(--text-1);
    }
    .warehouse-name svg {
      width: 16px;
      height: 16px;
      color: var(--primary);
    }
    .num-cell {
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }
    .danger-text {
      color: var(--danger) !important;
      font-weight: 600 !important;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 500;
    }
    .tag-success {
      background: #f0fdf4;
      color: var(--success);
      border: 1px solid rgba(34, 197, 94, 0.2);
    }
    .tag-warning {
      background: #fffbeb;
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    .tag-danger {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    /* ──── Chart Body ──── */
    .chart-body {
      width: 100%;
      height: 320px;
    }

    /* ──── Responsive ──── */
    @media (max-width: 1400px) {
      .kpi-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .charts-row {
        grid-template-columns: 1fr 1fr;
      }
    }
    @media (max-width: 1024px) {
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .charts-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="delivery-dashboard">

  <!-- ═══════════ Filter Bar ═══════════ -->
  <div class="filter-bar">
    <div class="filter-left">
      <input type="date" id="selectedDate" />
      <select id="warehouseSelect" onchange="onWarehouseChange()">
        <option value="all">全部仓库</option>
        <option value="dongguan">东莞沙田仓</option>
        <option value="beijing">北京顺义仓</option>
        <option value="shanghai">上海嘉定仓</option>
        <option value="xian">西安灞桥仓</option>
      </select>
      <select id="shipperSelect" onchange="onWarehouseChange()">
        <option value="waima" selected>歪马</option>
        <option value="xianshenghuo">鲜生活</option>
        <option value="lenglianzd">冷链直达</option>
      </select>
    </div>
    <div>
      <span class="update-time">
        <svg viewBox="0 0 1024 1024" fill="currentColor"><path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372zm-40-580v400l340-200z"/></svg>
        数据更新时间: <span id="updateTime"></span>
      </span>
    </div>
  </div>

  <!-- ═══════════ KPI Cards ═══════════ -->
  <div class="kpi-grid" id="kpiGrid"></div>

  <!-- ═══════════ Charts Row ═══════════ -->
  <div class="charts-row">
    <!-- Warehouse Operations Panel -->
    <div class="chart-card">
      <div class="card-title">
        <div class="title-left">
          <div class="title-bar"></div>
          <h3>仓储运营概览</h3>
        </div>
      </div>
      <!-- Tab Switcher -->
      <div class="ops-tabs" id="opsTabs">
        <div class="ops-tab active" data-tab="inbound" onclick="switchOpsTab('inbound')">
          <span class="ops-tab-label">入库</span>
          <span class="ops-tab-badge badge-blue" id="badgeInbound">4,876</span>
        </div>
        <div class="ops-tab" data-tab="outbound" onclick="switchOpsTab('outbound')">
          <span class="ops-tab-label">出库</span>
          <span class="ops-tab-badge badge-purple" id="badgeOutbound">2,187</span>
        </div>
        <div class="ops-tab" data-tab="inventory" onclick="switchOpsTab('inventory')">
          <span class="ops-tab-label">库存</span>
          <span class="ops-tab-badge badge-orange" id="badgeInventory">371</span>
        </div>
      </div>
      <!-- Tab Content -->
      <div class="ops-tab-content">
        <div id="tabInbound" class="ops-section">
          <div class="ops-metrics-row">
            <div class="ops-metric">
              <span class="ops-metric-label">计划入库</span>
              <span class="ops-metric-value blue" id="inbPlanned">5,200</span>
              <span class="ops-metric-unit">件</span>
            </div>
            <div class="ops-metric">
              <span class="ops-metric-label">实际入库</span>
              <span class="ops-metric-value" id="inbActual">4,876</span>
              <span class="ops-metric-unit">件</span>
            </div>
            <div class="ops-metric">
              <span class="ops-metric-label">入库达成率</span>
              <span class="ops-metric-value" id="inbRate">93.8%</span>
            </div>
          </div>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" id="inbProgress" style="width: 93.8%; background: #f59e0b;"></div>
          </div>
        </div>
        <div id="tabOutbound" class="ops-section" style="display:none;">
          <div class="funnel-container" id="funnelContainer"></div>
        </div>
        <div id="tabInventory" class="ops-section" style="display:none;">
          <div class="ops-metrics-row inventory-row">
            <div class="inventory-card warn">
              <div class="inventory-icon-wrap">
                <svg viewBox="0 0 1024 1024" fill="currentColor"><path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm0 820c-205.4 0-372-166.6-372-372s166.6-372 372-372 372 166.6 372 372-166.6 372-372 372zm-32-580h64v320h-64zm0 400h64v64h-64z"/></svg>
              </div>
              <div class="inventory-info">
                <span class="inventory-label">临期商品</span>
                <span class="inventory-value" id="invNearExpiry">324</span>
                <span class="inventory-unit">件</span>
              </div>
            </div>
            <div class="inventory-card danger">
              <div class="inventory-icon-wrap">
                <svg viewBox="0 0 1024 1024" fill="currentColor"><path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm-32 232h64v384h-64V296zm32 536a40 40 0 1 1 0-80 40 40 0 0 1 0 80z"/></svg>
              </div>
              <div class="inventory-info">
                <span class="inventory-label">过期商品</span>
                <span class="inventory-value" id="invExpired">47</span>
                <span class="inventory-unit">件</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Trend Chart -->
    <div class="chart-card">
      <div class="card-title">
        <div class="title-left">
          <div class="title-bar"></div>
          <h3>近7日配送趋势</h3>
        </div>
      </div>
      <div class="chart-body" id="trendChart"></div>
    </div>
  </div>

  <!-- ═══════════ Warehouse Performance Table ═══════════ -->
  <div class="table-section">
    <div class="card-title">
      <div class="title-left">
        <div class="title-bar"></div>
        <h3>各仓绩效对比</h3>
      </div>
    </div>
    <table class="data-table">
      <thead>
        <tr>
          <th>仓库</th>
          <th class="text-right">配送总单量</th>
          <th class="text-right">总件数</th>
          <th class="text-right">覆盖门店</th>
          <th class="text-right">及时送达</th>
          <th class="text-center">准时率</th>
          <th class="text-right">未派送</th>
          <th class="text-right">客诉异常</th>
          <th class="text-center">客诉率</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<script>
// ──── Data ────
const now = new Date();
const pad = n => String(n).padStart(2, '0');
const formatDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const formatTime = d => `${formatDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

document.getElementById('selectedDate').value = formatDate(now);
document.getElementById('updateTime').textContent = formatTime(now);

// ──── KPI Definitions ────
function getKpiCards(m) {
  return [
    { label:'发货仓库数', value: String(m.warehouseCount), icon:'OfficeBuilding', color:'#3b83f6', bgColor:'#eff6ff', trend:'持平', trendUp:true, trendClass:'trend-neutral' },
    { label:'配送总单量', value: formatNum(m.totalOrders), icon:'Tickets', color:'#3b83f6', bgColor:'#eff6ff', trend:'+12.3%', trendUp:true, trendClass:'trend-good' },
    { label:'总件数', value: formatNum(m.totalItems), icon:'Box', color:'#8b5cf6', bgColor:'#f5f3ff', trend:'+8.7%', trendUp:true, trendClass:'trend-good' },
    { label:'覆盖门店数', value: formatNum(m.storeCount), icon:'Shop', color:'#06b6d4', bgColor:'#ecfeff', trend:'+3.2%', trendUp:true, trendClass:'trend-good' },
    { label:'及时送达单量', value: formatNum(m.onTimeOrders), icon:'CircleCheck', color:'#22c55e', bgColor:'#f0fdf4', trend:'-5.2%', trendUp:false, trendClass:'trend-bad' },
    { label:'配送准时率', value: m.onTimeRate.toFixed(2)+'%', icon:'Odometer',
      color: m.onTimeRate>=95?'#22c55e':m.onTimeRate>=80?'#f59e0b':'#ef4444',
      bgColor: m.onTimeRate>=95?'#f0fdf4':m.onTimeRate>=80?'#fffbeb':'#fef2f2',
      trend:'-2.1%', trendUp:false, trendClass:'trend-bad' },
    { label:'未派送量', value: formatNum(m.undelivered), icon:'Van',
      color: m.undelivered>100?'#ef4444':'#f59e0b',
      bgColor: m.undelivered>100?'#fef2f2':'#fffbeb',
      trend:'+15.8%', trendUp:true, trendClass:'trend-bad' },
    { label:'客诉异常单量', value: String(m.complaints), icon:'Warning',
      color: m.complaints>10?'#ef4444':'#f59e0b',
      bgColor: m.complaints>10?'#fef2f2':'#fffbeb',
      trend:'+2', trendUp:true, trendClass:'trend-bad' },
    { label:'客诉率', value: m.complaintRate.toFixed(2)+'%', icon:'ChatDotRound',
      color: m.complaintRate>2?'#ef4444':'#f59e0b',
      bgColor: m.complaintRate>2?'#fef2f2':'#fffbeb',
      trend:'+0.03%', trendUp:true, trendClass:'trend-bad' }
  ];
}

// ──── Render KPI Cards ────
function renderKPIs(wh) {
  const m = metricsMap[wh] || metricsMap.all;
  const cards = getKpiCards(m);
  const grid = document.getElementById('kpiGrid');
  grid.innerHTML = cards.map((kpi, idx) => `
    <div class="kpi-card" style="animation-delay: ${idx * 0.06}s">
      <div class="kpi-icon-wrap" style="background-color: ${kpi.bgColor}">
        <span style="color: ${kpi.color}">${icons[kpi.icon] || ''}</span>
      </div>
      <div class="kpi-body">
        <span class="kpi-label">${kpi.label}</span>
        <span class="kpi-value">${kpi.value}</span>
        <span class="kpi-trend ${kpi.trendClass}">
          ${kpi.trend !== '持平' ? (kpi.trendUp ? icons.CaretTop : icons.CaretBottom) : ''}
          ${kpi.trend} 较昨日
        </span>
      </div>
    </div>
  `).join('');
}

// ──── Render Operations Tab ────
function renderOpsTab(wh) {
  const inb = inboundDataMap[wh] || inboundDataMap.all;
  const outb = outboundFunnelMap[wh] || outboundFunnelMap.all;
  const inv = inventoryMap[wh] || inventoryMap.all;
  const outTotal = outb.reduce((s,r) => s+r.value, 0);

  // Update badges
  document.getElementById('badgeInbound').textContent = formatNum(inb.actual);
  document.getElementById('badgeOutbound').textContent = formatNum(outTotal);
  document.getElementById('badgeInventory').textContent = formatNum(inv.nearExpiry + inv.expired);

  // Inbound
  document.getElementById('inbPlanned').textContent = formatNum(inb.planned);
  const actualEl = document.getElementById('inbActual');
  actualEl.textContent = formatNum(inb.actual);
  actualEl.className = 'ops-metric-value ' + (inb.actual >= inb.planned ? 'green' : 'orange');
  const rateEl = document.getElementById('inbRate');
  rateEl.textContent = inb.rate + '%';
  rateEl.className = 'ops-metric-value ' + (inb.rate >= 95 ? 'green' : 'orange');
  const prog = document.getElementById('inbProgress');
  prog.style.width = inb.rate + '%';
  prog.style.background = inb.rate >= 95 ? '#22c55e' : '#f59e0b';

  // Outbound funnel
  const maxVal = Math.max(...outb.map(r => r.value));
  const funnelEl = document.getElementById('funnelContainer');
  funnelEl.innerHTML = outb.map((item, idx) => {
    const pct = Math.max((item.value / maxVal) * 100, 18);
    return `<div class="funnel-bar" style="animation-delay: ${idx * 0.08}s">
      <div class="funnel-bar-fill" style="width: ${pct}%; background: ${item.color}"></div>
      <div class="funnel-bar-info">
        <span class="funnel-label">${item.label}</span>
        <span class="funnel-value">${formatNum(item.value)}</span>
      </div>
    </div>`;
  }).join('');

  // Inventory
  document.getElementById('invNearExpiry').textContent = formatNum(inv.nearExpiry);
  document.getElementById('invExpired').textContent = formatNum(inv.expired);
}

// ──── Switch Tab ────
let activeTab = 'inbound';
function switchOpsTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.ops-tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  document.getElementById('tabInbound').style.display = tab === 'inbound' ? '' : 'none';
  document.getElementById('tabOutbound').style.display = tab === 'outbound' ? '' : 'none';
  document.getElementById('tabInventory').style.display = tab === 'inventory' ? '' : 'none';
}

// ──── Render Table ────
function renderTable() {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = warehouseTableData.map(row => {
    const rateTagClass = row.onTimeRate >= 95 ? 'tag-success' : row.onTimeRate >= 80 ? 'tag-warning' : 'tag-danger';
    const rowClass = row.onTimeRate < 70 ? 'row-danger' : '';
    return `<tr class="${rowClass}">
      <td>
        <div class="warehouse-name">
          ${icons.OfficeBuilding}
          <span>${row.name}</span>
        </div>
      </td>
      <td class="text-right"><span class="num-cell">${formatNum(row.totalOrders)}</span></td>
      <td class="text-right"><span class="num-cell">${formatNum(row.totalItems)}</span></td>
      <td class="text-right"><span class="num-cell">${formatNum(row.storeCount)}</span></td>
      <td class="text-right"><span class="num-cell">${formatNum(row.onTimeOrders)}</span></td>
      <td class="text-center"><span class="tag ${rateTagClass}">${row.onTimeRate.toFixed(2)}%</span></td>
      <td class="text-right"><span class="num-cell ${row.undelivered > 0 ? 'danger-text' : ''}">${row.undelivered}</span></td>
      <td class="text-right"><span class="num-cell ${row.complaints > 5 ? 'danger-text' : ''}">${row.complaints}</span></td>
      <td class="text-center"><span class="${row.complaintRate > 2 ? 'danger-text' : ''}">${row.complaintRate.toFixed(2)}%</span></td>
    </tr>`;
  }).join('');
}

// ──── Trend Chart ────
function getLast7Days() {
  const dateVal = document.getElementById('selectedDate').value;
  const base = dateVal ? new Date(dateVal) : new Date();
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(base);
    d.setDate(d.getDate() - i);
    days.push(`${pad(d.getMonth()+1)}-${pad(d.getDate())}`);
  }
  return days;
}

// ──── Warehouse Change Handler ────
function onWarehouseChange() {
  const wh = document.getElementById('warehouseSelect').value;
  document.getElementById('updateTime').textContent = formatTime(new Date());
  renderKPIs(wh);
  renderOpsTab(wh);
  renderTrendChart();
}

// ──── Init ────

renderOpsTab('all');
renderTable();
renderTrendChart();
